<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Road Vehicles · 马路交通工具 第 4 集 | StoryGarden</title>
<link rel="stylesheet" href="../assets/storygarden.css">
<link rel="stylesheet" href="games/common.css">
<link rel="stylesheet" href="games/reveal.css">
</head>
<body data-sg-page data-sg-section="english" data-sg-root=".." data-sg-title="交通工具 · 第 4 集" data-sg-parent="index.html" data-sg-parent-label="英语花园">

<div id="field" aria-hidden="true">
  <div id="stage">
    <div id="shadow"></div>
    <div id="garage">
      <div class="g-body"></div>
      <div class="g-hole"></div>
      <div id="star">🚗</div>
      <div class="g-door-wrap">
        <div class="g-door">
          <div class="face"><span class="eye l"></span><span class="eye r"></span><span class="mouth"></span><span class="blush l"></span><span class="blush r"></span></div>
        </div>
      </div>
      <div class="g-roof"></div>
      <div class="g-ramp"></div>
    </div>
  </div>
</div>

<div class="hud" id="hud">
  <button class="scene-banner" id="sceneBanner" aria-label="点击切换场景">
    <span class="sb-icon" id="sbIcon">🛣️</span>
    <span class="sb-name"><b id="sbZh">马路</b><i id="sbEn">Road</i></span>
    <span class="sb-hint">换地方玩 ⌄</span>
  </button>
</div>

<div class="picker" id="picker">
  <div class="picker-mask" id="pickerMask"></div>
  <div class="picker-box" role="dialog" aria-label="选择场景">
    <p class="picker-title">你想去哪儿玩？</p>
    <div class="picker-grid" id="pickerGrid"></div>
    <button class="picker-close" id="pickerClose">先不换 · Close</button>
  </div>
</div>

<script src="data-vehicles.js"></script>
<script src="games/common.js"></script>
<script src="games/reveal.js"></script>
<script src="../assets/search-index.js"></script>
<script src="../assets/storygarden.js"></script>
</body>
</html>
